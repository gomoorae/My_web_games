<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>일기토 - 무장결투</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #13162b;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="duel-v1.1.2.icon.png" />
<link rel="apple-touch-icon" href="duel-v1.1.2.apple-touch-icon.png"/>
<meta name="description" content="장수를 고르고 기마 일기토의 승부를 지켜보는 픽셀 게임"><meta name="theme-color" content="#14162a"><style>#status-progress{width:min(14rem,38vw);height:0.45rem;accent-color:#edc477}</style>
	<style>
body {
	--window-height: 100vh;
	height: var(--window-height);
	display: grid;
	grid-template: minmax(0, 1fr) / minmax(0, 1fr);
	place-items: center;
	background: #101419;
}
@supports (height: 100dvh) {
	body { --window-height: 100dvh; }
}
#duel-frame {
	position: relative;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: #000;
}
@media (any-hover: hover) and (any-pointer: fine), (min-width: 1280px) and (min-height: 720px) {
	#duel-frame {
		/* The 640 × 360 battlefield gets at most two CSS pixels per source pixel. */
		width: min(100%, calc(var(--window-height) * 16 / 9), 1280px);
		height: auto;
		aspect-ratio: 16 / 9;
	}
}
#canvas {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
}
.arcade-home {
	position: absolute;
	z-index: 2;
	top: env(safe-area-inset-top, 0px);
	left: 50%;
	transform: translateX(-50%);
	display: flex;
	align-items: flex-start;
	justify-content: center;
	min-height: 44px;
	color: #f6e1b4;
	font: 600 clamp(12px, 2vh, 15px)/1 system-ui, sans-serif;
	text-decoration: none;
	touch-action: manipulation;
}
.arcade-home > span {
	display: inline-flex;
	align-items: center;
	gap: .45em;
	box-sizing: border-box;
	height: clamp(23px, 4.5vh, 32px);
	padding-inline: 12px;
	border: 1px solid #a88b5f;
	border-top: 0;
	border-radius: 0 0 6px 6px;
	background: #172329;
	white-space: nowrap;
}
.arcade-home:hover > span, .arcade-home:focus-visible > span {
	background: #304044;
	border-color: #f6d89d;
}
.arcade-home:focus-visible {
	outline: none;
}
.arcade-home:focus-visible > span {
	outline: 2px solid #ffe2a1;
	outline-offset: 1px;
}
</style>
	</head>
	<body>
	<main id="duel-frame">
		<a class="arcade-home" href="../../#games" aria-label="게임 목록으로 돌아가기" title="게임 목록으로 돌아가기 (Alt+G)" aria-keyshortcuts="Alt+G" accesskey="g"><span><span aria-hidden="true">←</span>게임 목록</span></a>
		<canvas id="canvas">
			이 브라우저에서는 게임 화면을 표시할 수 없습니다.
		</canvas>
		<script>
(() => {
	const frame = document.getElementById("duel-frame");
	const canvas = document.getElementById("canvas");
	function sizeCanvas() {
		const rect = frame.getBoundingClientRect();
		const ratio = window.devicePixelRatio || 1;
		const width = Math.max(1, Math.round(rect.width * ratio));
		const height = Math.max(1, Math.round(rect.height * ratio));
		if (canvas.width !== width) canvas.width = width;
		if (canvas.height !== height) canvas.height = height;
	}
	// A window can move between displays without changing its CSS size.
	function watchPixelRatio() {
		sizeCanvas();
		matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`)
			.addEventListener("change", watchPixelRatio, { once: true });
	}
	watchPixelRatio();
	new ResizeObserver(sizeCanvas).observe(frame);
})();
document.getElementById("canvas").addEventListener("keydown", event => {
	if (event.code === "KeyG" && event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
		event.preventDefault();
		event.stopImmediatePropagation();
		document.querySelector(".arcade-home").click();
	}
}, true);
</script>

		<noscript>
			게임을 실행하려면 자바스크립트를 켜 주세요.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--false" src="duel-v1.1.2.png" alt="">
			<progress id="status-progress" aria-label="게임 불러오는 중"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="duel-v1.1.2.js"></script>
		<script src="duel-v1.1.2.pages.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"duel-v1.1.2","experimentalVK":false,"fileSizes":{"duel-v1.1.2.pck":147006300,"duel-v1.1.2.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;


(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		startPagesDuel(GODOT_CONFIG, {
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</main>
	</body>
</html>
